    name: "@SRCROOT/@BASEPACKAGEPATH/entity/@JavaModNameSpecialEntity.java"
  - template: specialentity/boat.java.ftl
    name: "@SRCROOT/@BASEPACKAGEPATH/entity/@JavaModNameBoat.java"
  - template: specialentity/chest_boat.java.ftl
    name: "@SRCROOT/@BASEPACKAGEPATH/entity/@JavaModNameChestBoat.java"
  - template: specialentity/boat_item.java.ftl
    name: "@SRCROOT/@BASEPACKAGEPATH/item/@JavaModNameBoatItem.java"
