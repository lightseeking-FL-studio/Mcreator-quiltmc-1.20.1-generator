    name: "@SRCROOT/@BASEPACKAGEPATH/client/renderer/entity/@JavaModNameBoatRenderer.java"
  - template: specialentity/boat_renderer_mixin.java.ftl
    name: "@SRCROOT/@BASEPACKAGEPATH/mixin/@JavaModNameBoatRendererMixin.java"

templates:
